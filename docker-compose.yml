services:
  # SQL Server local, solo por si no se usa el servidor Windows:
  # docker compose --profile local up -d
  sqlserver:
    profiles: ["local"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: cm-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Desafio3_Pass!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: cm-redis
    ports:
      - "6379:6379"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: cm-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  sqlserver-data:
